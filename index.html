<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MB 1843AE 遊覽車模擬器 v0.6</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#8dc6ea}
.hud{position:fixed;top:max(8px,env(safe-area-inset-top));z-index:5;background:#0009;border:1px solid #ffffff33;border-radius:12px;padding:7px 10px;font-size:12px;line-height:1.35;backdrop-filter:blur(5px)}
#leftHud{left:max(8px,env(safe-area-inset-left))}
#rightHud{right:max(8px,env(safe-area-inset-right));text-align:right}
#hint{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:6;background:#0009;border-radius:999px;padding:6px 11px;font-size:11px}
#joy{position:fixed;left:18px;bottom:18px;width:124px;height:124px;border-radius:50%;background:#0005;border:2px solid #ffffff55;z-index:10;touch-action:none}
#knob{position:absolute;left:34px;top:34px;width:52px;height:52px;border-radius:50%;background:#fffddd;border:2px solid #fff}
#actions{position:fixed;right:14px;top:38%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:7px}
button{border:1px solid #ffffff44;background:#000a;color:#fff;border-radius:12px;min-height:40px;padding:7px 10px;font-size:12px}
.primary{background:#e0bd00e8;color:#111;font-weight:700}
#drive{position:fixed;right:12px;bottom:12px;z-index:10;display:flex;align-items:flex-end;gap:8px}
.pedal{width:64px;height:92px;font-weight:700}.gas{background:#d8ba00e8;color:#111}.brk{background:#8b2525e8}
.steer{width:52px;height:52px;border-radius:50%;font-size:20px}.steerbox{display:flex;gap:7px;margin-bottom:10px}
#gears{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;display:flex;gap:6px}
.gear{height:40px;min-width:54px}
#rotate{display:none}
@media (orientation:portrait) and (max-width:900px){
#rotate{position:fixed;inset:0;background:#080808f2;z-index:999;display:flex;align-items:center;justify-content:center;text-align:center}
#rotate .card{background:#1c1c1c;border:1px solid #ffffff22;border-radius:20px;padding:26px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="leftHud"><b id="mode">步行模式</b><br><span id="status">用左下搖桿移動</span></div>
<div class="hud" id="rightHud"><b id="speed">0 km/h</b><br><span id="gearText">N・手煞車 ON</span><br><span id="engineText">引擎 OFF</span></div>
<div id="hint">左下搖桿走動・拖動畫面轉視角</div>

<div id="joy"><div id="knob"></div></div>

<div id="actions">
<button id="door" class="primary">開／關前門</button>
<button id="seat">坐駕駛座</button>
<button id="engineBtn">啟動引擎</button>
<button id="parkBtn">氣壓手煞車</button>
<button id="exitBtn">離開駕駛座</button>
</div>

<div id="gears"><button id="gearDown" class="gear">檔位 −</button><button id="gearUp" class="gear">檔位 ＋</button></div>

<div id="drive">
<div class="steerbox"><button id="steerL" class="steer">◀</button><button id="steerR" class="steer">▶</button></div>
<button id="brake" class="pedal brk">煞車</button>
<button id="gas" class="pedal gas">油門</button>
</div>

<div id="rotate"><div class="card"><div style="font-size:48px">↻</div><b style="font-size:21px">請把手機橫向</b><div style="margin-top:8px;color:#bbb;font-size:13px">橫向後才會顯示遊戲</div></div></div>

<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);
let W=innerWidth,H=innerHeight,D=Math.min(2,devicePixelRatio||1);
function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();

const s={seated:false,door:false,engine:false,park:true,gear:0,speed:0,
px:0,pz:8,yaw:0,jx:0,jy:0,gas:false,brake:false,sl:false,sr:false,last:performance.now(),worldX:0};
const gears=['N','1','2','3','4','5','6','7','8'];
let ac=null,osc=null,gain=null;

function au(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function hiss(){const a=au(),b=a.createBuffer(1,a.sampleRate*.4,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const src=a.createBufferSource(),f=a.createBiquadFilter(),v=a.createGain();src.buffer=b;f.type='highpass';f.frequency.value=900;v.gain.value=.08;src.connect(f).connect(v).connect(a.destination);src.start();v.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.4);src.stop(a.currentTime+.4)}
function startSound(){const a=au(),o=a.createOscillator(),v=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(65,a.currentTime);o.frequency.linearRampToValueAtTime(92,a.currentTime+.7);v.gain.value=.12;o.connect(v).connect(a.destination);o.start();v.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.8);o.stop(a.currentTime+.8)}
function engOn(){if(osc)return;const a=au();osc=a.createOscillator();gain=a.createGain();osc.type='sawtooth';osc.frequency.value=29;gain.gain.value=.045;osc.connect(gain).connect(a.destination);osc.start()}
function engOff(){if(!osc)return;try{osc.stop()}catch(e){}osc=null;gain=null}

function ui(){
$('mode').textContent=s.seated?'駕駛模式':'步行模式';
$('status').textContent=s.seated?(s.engine?'可以開車':'請先啟動引擎'):(s.door?'前門已開，可按坐駕駛座':'用左下搖桿移動');
$('speed').textContent=Math.round(s.speed)+' km/h';
$('gearText').textContent=gears[s.gear]+'・手煞車 '+(s.park?'ON':'OFF');
$('engineText').textContent='引擎 '+(s.engine?'ON':'OFF');
$('seat').style.display=s.seated?'none':'block';
$('engineBtn').style.display=s.seated?'block':'none';
$('parkBtn').style.display=s.seated?'block':'none';
$('exitBtn').style.display=s.seated?'block':'none';
$('gears').style.display=s.seated?'flex':'none';
$('drive').style.opacity=s.seated?'1':'.25';
$('drive').style.pointerEvents=s.seated?'auto':'none';
$('joy').style.opacity=s.seated?'.25':'1';
$('joy').style.pointerEvents=s.seated?'none':'auto';
}

function rr(x,y,w,h,r,color){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=color;ctx.fill()}
function drawWalk(){
let sky=ctx.createLinearGradient(0,0,0,H*.65);sky.addColorStop(0,'#8ec8ed');sky.addColorStop(1,'#edf7fb');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.65);
ctx.fillStyle='#73925c';ctx.fillRect(0,H*.65,W,H*.35);
ctx.fillStyle='#474a4e';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(W*.18,H*.65);ctx.lineTo(W*.82,H*.65);ctx.lineTo(W,H);ctx.fill();

const scale=Math.max(.65,Math.min(1.25,1.05-s.pz*.035));
const bw=Math.min(W*.68,760)*scale,bh=bw*.34;
const bx=W*.5-bw*.5 - s.px*45;
const by=H*.34 + s.pz*22;
rr(bx,by,bw,bh,22,'#e3c600');
rr(bx+bw*.06,by+bh*.10,bw*.84,bh*.36,10,'#10171c');
for(let i=0;i<7;i++){ctx.fillStyle='#233640';ctx.fillRect(bx+bw*(.085+i*.105),by+bh*.135,bw*.085,bh*.25)}
ctx.fillStyle='#111';for(const wx of [bx+bw*.19,bx+bw*.76]){ctx.beginPath();ctx.arc(wx,by+bh,bh*.17,0,Math.PI*2);ctx.fill()}
ctx.save();ctx.translate(bx+bw*.90,by+bh*.48);ctx.rotate(s.door?-.75:0);ctx.fillStyle='#d8bd00';ctx.fillRect(0,0,bw*.075,bh*.46);ctx.fillStyle='#263a44';ctx.fillRect(bw*.01,bh*.04,bw*.052,bh*.22);ctx.restore();
ctx.fillStyle='#fff9';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText('＋',W/2,H/2);
}
function drawDrive(){
let sky=ctx.createLinearGradient(0,0,0,H*.62);sky.addColorStop(0,'#8ec8ed');sky.addColorStop(1,'#eef8fb');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.64);
ctx.fillStyle='#4d5054';ctx.beginPath();ctx.moveTo(0,H*.64);ctx.lineTo(W*.38,H*.46);ctx.lineTo(W*.62,H*.46);ctx.lineTo(W,H*.64);ctx.fill();
rr(W*.05,H*.61,W*.90,H*.34,22,'#2d3236');rr(W*.38,H*.67,W*.25,H*.15,12,'#101316');
ctx.fillStyle='#dce9df';ctx.textAlign='center';ctx.font='700 22px monospace';ctx.fillText(Math.round(s.speed)+' km/h',W*.505,H*.735);ctx.font='15px monospace';ctx.fillText('GO240-8 '+gears[s.gear],W*.505,H*.785);
ctx.strokeStyle='#111';ctx.lineWidth=18;ctx.beginPath();ctx.arc(W*.30,H*.79,Math.min(W,H)*.10,0,Math.PI*2);ctx.stroke();
}
function draw(){ctx.clearRect(0,0,W,H);s.seated?drawDrive():drawWalk()}

const joy=$('joy'),knob=$('knob');let jp=null;
function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.31,len=Math.hypot(dx,dy)||1;if(len>max){dx*=max/len;dy*=max/len}s.jx=dx/max;s.jy=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}
joy.addEventListener('pointerdown',e=>{e.preventDefault();jp=e.pointerId;joy.setPointerCapture(jp);joyMove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jp)joyMove(e)});
function joyEnd(e){if(e.pointerId!==jp)return;jp=null;s.jx=s.jy=0;knob.style.transform='translate(0,0)'}
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);

function hold(id,key){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);s[key]=true});const off=e=>{s[key]=false};el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off)}
hold('gas','gas');hold('brake','brake');hold('steerL','sl');hold('steerR','sr');

$('door').onclick=()=>{au();s.door=!s.door;hiss();ui()};
$('seat').onclick=()=>{if(!s.door){$('hint').textContent='先開前門';return}s.seated=true;$('hint').textContent='放手煞車、進檔、踩油門';ui()};
$('exitBtn').onclick=()=>{s.seated=false;s.speed=0;$('hint').textContent='左下搖桿走動・拖動畫面轉視角';ui()};
$('engineBtn').onclick=()=>{if(!s.seated)return;au();if(!s.engine){startSound();$('hint').textContent='啟動中…';setTimeout(()=>{s.engine=true;engOn();$('hint').textContent='放手煞車、進檔、踩油門';ui()},800)}else{s.engine=false;s.speed=0;engOff();ui()}};
$('parkBtn').onclick=()=>{s.park=!s.park;hiss();ui()};
$('gearUp').onclick=()=>{s.gear=Math.min(8,s.gear+1);ui()};
$('gearDown').onclick=()=>{s.gear=Math.max(0,s.gear-1);ui()};

function update(dt){
if(!s.seated){
  // IMPORTANT: move the camera/world, not a tiny player dot.
  s.px += s.jx*3.3*dt;
  s.pz += s.jy*3.3*dt;
  s.px=Math.max(-8,Math.min(8,s.px));
  s.pz=Math.max(-4,Math.min(12,s.pz));
}else{
  const target=s.sl?-.7:s.sr?.7:0;s.steer+=(target-s.steer)*Math.min(1,dt*6);
  if(s.engine&&!s.park&&s.gear>0&&s.gas)s.speed+=14*dt*(1-(s.gear-1)*.055);
  if(s.brake)s.speed-=38*dt;if(s.park)s.speed-=52*dt;if(!s.gas)s.speed-=2.7*dt;
  s.speed=Math.max(0,Math.min(120,s.speed));
  if(osc&&ac){osc.frequency.setTargetAtTime(29+s.speed*.42+(s.gas?18:0),ac.currentTime,.08);gain.gain.setTargetAtTime(.04+s.speed*.0003+(s.gas?.028:0),ac.currentTime,.08)}
}
}
function loop(t){const dt=Math.min(.033,(t-s.last)/1000);s.last=t;update(dt);draw();ui();requestAnimationFrame(loop)}
ui();draw();requestAnimationFrame(t=>{s.last=t;requestAnimationFrame(loop)});
})();
</script>
</body>
</html>
