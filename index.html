<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>自由建造</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111827; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { touch-action: none; overscroll-behavior: none; }
    #app { position: fixed; inset: 0; overflow: hidden; background: #dfe8ea; }
    #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .topbar { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display:flex; justify-content:space-between; gap:8px; pointer-events:none; }
    .group { display:flex; gap:8px; pointer-events:auto; }
    button { min-width: 46px; min-height: 46px; border: 1px solid rgba(255,255,255,.28); border-radius: 14px; background: rgba(17,24,39,.82); color:white; font-size:15px; padding: 0 14px; backdrop-filter: blur(12px); }
    button.active { background: rgba(37,99,235,.92); }
    .hint { position:absolute; left:12px; bottom: calc(92px + env(safe-area-inset-bottom)); max-width:70%; padding:9px 12px; border-radius:12px; background:rgba(17,24,39,.78); color:white; font-size:13px; backdrop-filter:blur(10px); pointer-events:none; }
    .toolbar { position:absolute; left:0; right:0; bottom:0; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); background:linear-gradient(to top,rgba(17,24,39,.96),rgba(17,24,39,.78)); }
    .tools { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
    .tools::-webkit-scrollbar { display:none; }
    .tool { flex:0 0 auto; min-width:74px; }
  </style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>

  <div class="topbar">
    <div class="group">
      <button id="cameraBtn">👁 視角</button>
      <button id="buildBtn" class="active">🔨 建造</button>
    </div>
    <div class="group">
      <button id="undoBtn">↶</button>
      <button id="clearBtn">🗑</button>
    </div>
  </div>

  <div id="hint" class="hint">拖曳空地拉牆</div>

  <div class="toolbar">
    <div class="tools">
      <button class="tool active" data-tool="wall">牆</button>
      <button class="tool" data-tool="floor">地板</button>
      <button class="tool" data-tool="door">門</button>
      <button class="tool" data-tool="window">窗</button>
      <button class="tool" data-tool="road">道路</button>
      <button class="tool" data-tool="rail">軌道</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";

const canvas = document.getElementById("scene");
const hint = document.getElementById("hint");
const cameraBtn = document.getElementById("cameraBtn");
const buildBtn = document.getElementById("buildBtn");
const undoBtn = document.getElementById("undoBtn");
const clearBtn = document.getElementById("clearBtn");
const toolButtons = [...document.querySelectorAll(".tool")];

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe8ea);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
const target = new THREE.Vector3(0,0,0);
let yaw = 0.75, pitch = 0.62, distance = 24;

scene.add(new THREE.HemisphereLight(0xffffff, 0x68725f, 2.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(18, 28, 14);
sun.castShadow = true;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120,120),
  new THREE.MeshStandardMaterial({ color: 0x91aa80, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(120, 60, 0x6e796c, 0x889584);
grid.position.y = 0.01;
scene.add(grid);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const objects = [];
const walls = [];

let mode = "build";
let tool = "wall";
let wallStart = null;
let wallPreview = null;
let pointerDown = false;
let pointerMoved = false;
let lastX = 0, lastY = 0;
let pinchStart = null;

function setMode(next) {
  mode = next;
  cameraBtn.classList.toggle("active", mode === "camera");
  buildBtn.classList.toggle("active", mode === "build");
  hint.textContent = mode === "camera"
    ? "單指拖曳旋轉視角，雙指縮放"
    : tool === "wall" ? "拖曳空地拉牆" : "點空地放置";
}
cameraBtn.addEventListener("click", () => setMode("camera"));
buildBtn.addEventListener("click", () => setMode("build"));

toolButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    tool = btn.dataset.tool;
    setMode("build");
    toolButtons.forEach(b => b.classList.toggle("active", b === btn));
    hint.textContent = tool === "wall"
      ? "拖曳空地拉牆"
      : (tool === "door" || tool === "window")
        ? "靠近牆壁點一下放置"
        : "點空地放置";
  });
});

function updateSize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", updateSize);
updateSize();

function updateCamera() {
  const cp = Math.cos(pitch);
  camera.position.set(
    target.x + distance * cp * Math.sin(yaw),
    target.y + distance * Math.sin(pitch),
    target.z + distance * cp * Math.cos(yaw)
  );
  camera.lookAt(target);
}

function snap(v) { return Math.round(v * 2) / 2; }

function groundPoint(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((clientX-r.left)/r.width)*2-1;
  pointer.y = -((clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObject(ground, false)[0];
  if (!hit) return null;
  return new THREE.Vector3(snap(hit.point.x), 0, snap(hit.point.z));
}

function mat(color, transparent=false, opacity=1) {
  return new THREE.MeshStandardMaterial({ color, roughness: .82, transparent, opacity });
}

function addObject(obj, kind) {
  obj.userData.kind = kind;
  scene.add(obj);
  objects.push(obj);
  if (kind === "wall") walls.push(obj);
}

function makeWall(a,b,preview=false) {
  const dx=b.x-a.x, dz=b.z-a.z;
  const len=Math.max(.5,Math.hypot(dx,dz));
  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(len,2.7,.16),
    mat(preview?0x9fb2bc:0xe6e1d8, preview, preview?.62:1)
  );
  mesh.position.set((a.x+b.x)/2,1.35,(a.z+b.z)/2);
  mesh.rotation.y=-Math.atan2(dz,dx);
  mesh.castShadow=!preview;
  mesh.receiveShadow=true;
  return mesh;
}

function placeSimple(p, kind) {
  let mesh;
  if (kind === "floor") {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(2,.14,2), mat(0xb9a78c));
    mesh.position.set(p.x,.07,p.z);
  } else if (kind === "road") {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(4,.06,2), mat(0x454545));
    mesh.position.set(p.x,.03,p.z);
  } else if (kind === "rail") {
    const g = new THREE.Group();
    for (const x of [-.48,.48]) {
      const r = new THREE.Mesh(new THREE.BoxGeometry(.08,.08,3), mat(0x555555));
      r.position.set(x,.08,0); g.add(r);
    }
    for (let z=-1.3; z<=1.3; z+=.45) {
      const t = new THREE.Mesh(new THREE.BoxGeometry(1.35,.06,.13), mat(0x6a5443));
      t.position.set(0,.04,z); g.add(t);
    }
    g.position.set(p.x,.02,p.z);
    mesh=g;
  }
  addObject(mesh, kind);
}

function nearestWall(p) {
  let best=null, dist=Infinity;
  for (const w of walls) {
    const d=Math.hypot(p.x-w.position.x,p.z-w.position.z);
    if (d<dist) { dist=d; best=w; }
  }
  return dist <= 2.2 ? best : null;
}

function placeAttached(p, kind) {
  const w=nearestWall(p);
  if (!w) { hint.textContent="請靠近牆壁放置"; return; }
  const isDoor=kind==="door";
  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(isDoor?1:1.3,isDoor?2.15:1.05,.2),
    mat(isDoor?0x795c43:0x9bc3d2,!isDoor,!isDoor?.55:1)
  );
  mesh.position.set(p.x,isDoor?1.075:1.55,p.z);
  mesh.rotation.y=w.rotation.y;
  addObject(mesh,kind);
}

function removePreview() {
  if (wallPreview) { scene.remove(wallPreview); wallPreview=null; }
}

undoBtn.addEventListener("click", () => {
  removePreview();
  const obj=objects.pop();
  if (!obj) return;
  scene.remove(obj);
  if (obj.userData.kind==="wall") {
    const i=walls.indexOf(obj); if (i>=0) walls.splice(i,1);
  }
});

clearBtn.addEventListener("click", () => {
  removePreview();
  for (const obj of objects) scene.remove(obj);
  objects.length=0; walls.length=0;
});

canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  pointerDown=true; pointerMoved=false; lastX=e.clientX; lastY=e.clientY;
  canvas.setPointerCapture?.(e.pointerId);

  if (mode==="build") {
    const p=groundPoint(e.clientX,e.clientY);
    if (!p) return;
    if (tool==="wall") {
      wallStart=p;
      wallPreview=makeWall(p,p,true);
      scene.add(wallPreview);
    } else if (tool==="door" || tool==="window") {
      placeAttached(p,tool);
    } else {
      placeSimple(p,tool);
    }
  }
}, {passive:false});

canvas.addEventListener("pointermove", e => {
  e.preventDefault();
  if (!pointerDown) return;

  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  if (Math.abs(dx)+Math.abs(dy)>4) pointerMoved=true;

  if (mode==="camera") {
    yaw -= dx*.008;
    pitch = Math.max(.16,Math.min(1.3,pitch+dy*.006));
  } else if (tool==="wall" && wallStart && wallPreview) {
    const p=groundPoint(e.clientX,e.clientY);
    if (p) {
      scene.remove(wallPreview);
      wallPreview=makeWall(wallStart,p,true);
      scene.add(wallPreview);
    }
  }

  lastX=e.clientX; lastY=e.clientY;
}, {passive:false});

canvas.addEventListener("pointerup", e => {
  e.preventDefault();
  if (mode==="build" && tool==="wall" && wallStart) {
    const p=groundPoint(e.clientX,e.clientY);
    removePreview();
    if (p && Math.hypot(p.x-wallStart.x,p.z-wallStart.z)>=.5) {
      addObject(makeWall(wallStart,p,false),"wall");
    }
    wallStart=null;
  }
  pointerDown=false;
}, {passive:false});

canvas.addEventListener("touchstart", e => {
  if (e.touches.length===2) {
    const [a,b]=e.touches;
    pinchStart=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  }
  e.preventDefault();
}, {passive:false});

canvas.addEventListener("touchmove", e => {
  if (e.touches.length===2) {
    const [a,b]=e.touches;
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if (pinchStart!==null) distance=Math.max(7,Math.min(45,distance-(d-pinchStart)*.045));
    pinchStart=d;
  }
  e.preventDefault();
}, {passive:false});

canvas.addEventListener("touchend", e => {
  pinchStart=null;
  e.preventDefault();
}, {passive:false});

canvas.addEventListener("contextmenu", e => e.preventDefault());

function loop() {
  updateCamera();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
</body>
</html>
