<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>億家設計遊戲 v3</title>
<link rel="manifest" href="./manifest.webmanifest"/>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}
#crosshair:before{left:10px;top:2px;width:2px;height:18px}
#crosshair:after{left:2px;top:10px;width:18px;height:2px}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.brand,.status{pointer-events:none;padding:8px 11px;border-radius:12px;background:rgba(15,23,42,.72);color:#fff;font-size:13px;backdrop-filter:blur(10px)}
#joystick{position:absolute;left:18px;bottom:calc(112px + env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);touch-action:none}
#stick{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.actions{position:absolute;right:14px;bottom:calc(112px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.action{width:70px;height:58px;border:0;border-radius:16px;background:rgba(15,23,42,.84);color:#fff;font-size:15px;font-weight:700;backdrop-filter:blur(10px);box-shadow:0 5px 18px rgba(0,0,0,.22)}
.action:active{transform:scale(.96)}
#jumpBtn{width:58px;height:58px;border-radius:50%;align-self:flex-end}
.hotbarWrap{position:absolute;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(15,23,42,.96),rgba(15,23,42,.58),transparent)}
#hotbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
#hotbar::-webkit-scrollbar{display:none}
.slot{flex:0 0 auto;min-width:74px;height:66px;border:2px solid rgba(255,255,255,.28);border-radius:14px;background:rgba(15,23,42,.78);color:#fff;padding:5px 8px;font-size:12px}
.slot .icon{display:block;font-size:26px;line-height:28px}
.slot.active{border-color:#fff;background:rgba(37,99,235,.9)}
#save{position:absolute;right:14px;top:calc(max(10px,env(safe-area-inset-top)) + 45px);padding:7px 10px;border-radius:10px;background:rgba(15,23,42,.7);color:white;font-size:12px;display:none}
#help{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 48px);transform:translateX(-50%);padding:7px 10px;border-radius:10px;background:rgba(15,23,42,.7);color:white;font-size:12px;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<div id="app">
<canvas id="scene"></canvas>
<div id="crosshair"></div>

<div class="top">
  <div class="brand">億家設計遊戲 v3</div>
  <div id="status" class="status">第一人稱</div>
</div>

<div id="save">已儲存</div>
<div id="help">左邊移動・右半畫面滑動轉視角</div>

<div id="joystick"><div id="stick"></div></div>

<div class="actions">
  <button id="jumpBtn" class="action">跳</button>
  <button id="placeBtn" class="action">放置</button>
  <button id="removeBtn" class="action">拆除</button>
</div>

<div class="hotbarWrap">
  <div id="hotbar">
    <button class="slot active" data-kind="floor"><span class="icon">⬜</span>地板</button>
    <button class="slot" data-kind="wall"><span class="icon">🧱</span>牆</button>
    <button class="slot" data-kind="door"><span class="icon">🚪</span>門</button>
    <button class="slot" data-kind="window"><span class="icon">🪟</span>窗</button>
    <button class="slot" data-kind="road"><span class="icon">🛣️</span>道路</button>
    <button class="slot" data-kind="rail"><span class="icon">🛤️</span>軌道</button>
  </div>
</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";

const canvas=document.getElementById("scene");
const statusEl=document.getElementById("status");
const saveEl=document.getElementById("save");
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
const placeBtn=document.getElementById("placeBtn");
const removeBtn=document.getElementById("removeBtn");
const jumpBtn=document.getElementById("jumpBtn");
const slots=[...document.querySelectorAll(".slot")];

const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ec8e8);
scene.fog=new THREE.Fog(0x9ec8e8,45,100);

const camera=new THREE.PerspectiveCamera(72,1,.1,160);

scene.add(new THREE.HemisphereLight(0xffffff,0x61705b,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(20,35,15);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(140,140),
  new THREE.MeshStandardMaterial({color:0x7ea36f,roughness:1})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
ground.userData.isGround=true;
scene.add(ground);

const grid=new THREE.GridHelper(140,140,0x617358,0x82917d);
grid.position.y=.012;
scene.add(grid);

const world=new THREE.Group();
scene.add(world);

const raycaster=new THREE.Raycaster();
const center=new THREE.Vector2(0,0);

const PLAYER_HEIGHT=1.72;
const EYE_HEIGHT=1.62;
const MOVE_SPEED=4.3;
const GRAVITY=16;
const JUMP_SPEED=6.5;

let pos=new THREE.Vector3(0,PLAYER_HEIGHT,8);
let yaw=Math.PI;
let pitch=-0.08;
let velocityY=0;
let onGround=true;
let moveX=0,moveY=0;
let selectedKind="floor";
let preview=null;
let targetHit=null;
let lookPointer=null;
let lookLastX=0,lookLastY=0;
let joystickPointer=null;
let saveTimer=null;

const objects=[];

function resize(){
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize",resize);
resize();

function mat(color,opts={}){
  return new THREE.MeshStandardMaterial({
    color,roughness:.82,metalness:0,...opts
  });
}

function flashSave(){
  saveEl.style.display="block";
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>saveEl.style.display="none",650);
}

function serialize(){
  const data=objects.map(o=>({
    kind:o.userData.kind,
    x:o.position.x,y:o.position.y,z:o.position.z,
    ry:o.rotation.y
  }));
  localStorage.setItem("yijiaV3World",JSON.stringify(data));
  flashSave();
}

function createRail(){
  const g=new THREE.Group();
  for(const x of[-.42,.42]){
    const rail=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,2),mat(0x55585c,{metalness:.4}));
    rail.position.set(x,.08,0);
    g.add(rail);
  }
  for(let z=-.8;z<=.8;z+=.35){
    const sleeper=new THREE.Mesh(new THREE.BoxGeometry(1.18,.07,.12),mat(0x654d38));
    sleeper.position.set(0,.035,z);
    g.add(sleeper);
  }
  return g;
}

function createObject(kind){
  let obj;
  if(kind==="floor"){
    obj=new THREE.Mesh(new THREE.BoxGeometry(1,.16,1),mat(0xbda989));
    obj.position.y=.08;
  }else if(kind==="wall"){
    obj=new THREE.Mesh(new THREE.BoxGeometry(1,2.6,.18),mat(0xe7e2d8));
    obj.position.y=1.3;
  }else if(kind==="door"){
    obj=new THREE.Mesh(new THREE.BoxGeometry(.9,2.1,.12),mat(0x79593f));
    obj.position.y=1.05;
  }else if(kind==="window"){
    obj=new THREE.Mesh(new THREE.BoxGeometry(1.1,.9,.1),mat(0x8fc9df,{transparent:true,opacity:.62}));
    obj.position.y=1.45;
  }else if(kind==="road"){
    obj=new THREE.Mesh(new THREE.BoxGeometry(2,.08,1),mat(0x43474d));
    obj.position.y=.04;
  }else if(kind==="rail"){
    obj=createRail();
  }
  obj.userData.kind=kind;
  obj.traverse?.(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true}});
  return obj;
}

function addObject(kind,x,y,z,ry=0,save=true){
  const obj=createObject(kind);
  obj.position.x=x;
  obj.position.z=z;
  if(kind==="rail")obj.position.y=.02;
  if(typeof y==="number"){
    if(kind==="floor")obj.position.y=y;
    else if(kind==="wall")obj.position.y=y;
    else if(kind==="door")obj.position.y=y;
    else if(kind==="window")obj.position.y=y;
    else if(kind==="road")obj.position.y=y;
    else if(kind==="rail")obj.position.y=y;
  }
  obj.rotation.y=ry;
  world.add(obj);
  objects.push(obj);
  if(save)serialize();
  return obj;
}

function load(){
  try{
    const data=JSON.parse(localStorage.getItem("yijiaV3World")||"[]");
    for(const d of data)addObject(d.kind,d.x,d.y,d.z,d.ry||0,false);
  }catch{}
}
load();

function snap(v){return Math.round(v)}

function cameraForward(){
  return new THREE.Vector3(
    Math.sin(yaw)*Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(yaw)*Math.cos(pitch)
  ).normalize();
}
function flatForward(){
  return new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)).normalize();
}
function flatRight(){
  return new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)).normalize();
}

function updateCamera(){
  camera.position.set(pos.x,pos.y-PLAYER_HEIGHT+EYE_HEIGHT,pos.z);
  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
}

function pick(){
  raycaster.setFromCamera(center,camera);
  const candidates=[ground,...objects.flatMap(o=>{
    const a=[];
    if(o.isMesh)a.push(o);
    o.traverse?.(c=>{if(c.isMesh&&c!==o)a.push(c)});
    return a;
  })];
  const hits=raycaster.intersectObjects(candidates,false);
  targetHit=hits.find(h=>h.distance<=6.2)||null;
  return targetHit;
}

function rootObj(mesh){
  let c=mesh;
  while(c.parent&&c.parent!==world&&c.parent!==scene)c=c.parent;
  return objects.includes(c)?c:null;
}

function getPlacement(){
  const h=pick();
  if(!h)return null;
  const p=h.point.clone();
  const n=h.face?.normal?.clone()||new THREE.Vector3(0,1,0);
  if(h.object!==ground){
    n.transformDirection(h.object.matrixWorld);
    p.addScaledVector(n,.52);
  }
  return {
    x:snap(p.x),
    z:snap(p.z),
    yBase:Math.max(0,p.y)
  };
}

function ensurePreview(){
  if(preview){
    scene.remove(preview);
    preview=null;
  }
  preview=createObject(selectedKind);
  preview.traverse?.(c=>{
    if(c.isMesh){
      c.material=c.material.clone();
      c.material.transparent=true;
      c.material.opacity=.45;
      c.material.depthWrite=false;
    }
  });
  scene.add(preview);
}

function updatePreview(){
  if(!preview)return;
  const pl=getPlacement();
  if(!pl){preview.visible=false;return}
  preview.visible=true;
  preview.position.x=pl.x;
  preview.position.z=pl.z;
  preview.rotation.y=Math.round(yaw/(Math.PI/2))*(Math.PI/2);

  if(selectedKind==="floor")preview.position.y=.08;
  if(selectedKind==="road")preview.position.y=.04;
  if(selectedKind==="rail")preview.position.y=.02;
  if(selectedKind==="wall")preview.position.y=1.3;
  if(selectedKind==="door")preview.position.y=1.05;
  if(selectedKind==="window")preview.position.y=1.45;
}

ensurePreview();

slots.forEach(btn=>btn.addEventListener("click",()=>{
  selectedKind=btn.dataset.kind;
  slots.forEach(b=>b.classList.toggle("active",b===btn));
  statusEl.textContent="選擇："+btn.textContent.trim();
  ensurePreview();
}));

placeBtn.addEventListener("click",()=>{
  const pl=getPlacement();
  if(!pl)return;
  let y=.08;
  if(selectedKind==="wall")y=1.3;
  else if(selectedKind==="door")y=1.05;
  else if(selectedKind==="window")y=1.45;
  else if(selectedKind==="road")y=.04;
  else if(selectedKind==="rail")y=.02;
  const rot=Math.round(yaw/(Math.PI/2))*(Math.PI/2);
  addObject(selectedKind,pl.x,y,pl.z,rot,true);
});

removeBtn.addEventListener("click",()=>{
  const h=pick();
  if(!h||h.object===ground)return;
  const root=rootObj(h.object);
  if(!root)return;
  world.remove(root);
  const i=objects.indexOf(root);
  if(i>=0)objects.splice(i,1);
  serialize();
});

jumpBtn.addEventListener("click",()=>{
  if(onGround){
    velocityY=JUMP_SPEED;
    onGround=false;
  }
});

function joyUpdate(clientX,clientY){
  const r=joystick.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=clientX-cx,dy=clientY-cy;
  const max=38;
  const len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max}
  stick.style.transform=`translate(${dx}px,${dy}px)`;
  moveX=dx/max;
  moveY=dy/max;
}

joystick.addEventListener("pointerdown",e=>{
  joystickPointer=e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  joyUpdate(e.clientX,e.clientY);
  e.preventDefault();
});
joystick.addEventListener("pointermove",e=>{
  if(e.pointerId!==joystickPointer)return;
  joyUpdate(e.clientX,e.clientY);
  e.preventDefault();
});
function joyEnd(e){
  if(e.pointerId!==joystickPointer)return;
  joystickPointer=null;
  moveX=moveY=0;
  stick.style.transform="translate(0,0)";
  e.preventDefault();
}
joystick.addEventListener("pointerup",joyEnd);
joystick.addEventListener("pointercancel",joyEnd);

canvas.addEventListener("pointerdown",e=>{
  if(e.clientX<innerWidth*.38)return;
  lookPointer=e.pointerId;
  lookLastX=e.clientX;
  lookLastY=e.clientY;
  canvas.setPointerCapture?.(e.pointerId);
  e.preventDefault();
});
canvas.addEventListener("pointermove",e=>{
  if(e.pointerId!==lookPointer)return;
  const dx=e.clientX-lookLastX;
  const dy=e.clientY-lookLastY;
  yaw-=dx*.006;
  pitch-=dy*.005;
  pitch=Math.max(-1.25,Math.min(1.25,pitch));
  lookLastX=e.clientX;
  lookLastY=e.clientY;
  e.preventDefault();
});
canvas.addEventListener("pointerup",e=>{
  if(e.pointerId===lookPointer)lookPointer=null;
  e.preventDefault();
});
canvas.addEventListener("pointercancel",e=>{
  if(e.pointerId===lookPointer)lookPointer=null;
});

document.addEventListener("contextmenu",e=>e.preventDefault());

let last=performance.now();
function loop(now){
  const dt=Math.min(.035,(now-last)/1000);
  last=now;

  const f=flatForward();
  const r=flatRight();
  const move=new THREE.Vector3();
  move.addScaledVector(r,moveX);
  move.addScaledVector(f,-moveY);
  if(move.lengthSq()>1)move.normalize();
  pos.addScaledVector(move,MOVE_SPEED*dt);

  velocityY-=GRAVITY*dt;
  pos.y+=velocityY*dt;
  if(pos.y<=PLAYER_HEIGHT){
    pos.y=PLAYER_HEIGHT;
    velocityY=0;
    onGround=true;
  }

  pos.x=Math.max(-67,Math.min(67,pos.x));
  pos.z=Math.max(-67,Math.min(67,pos.z));

  updateCamera();
  updatePreview();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
</body>
</html>
