<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MB 1843AE / O500 AI 高擬真展示版</title>
<style>
:root{
  --panel:rgba(10,13,16,.72);
  --line:rgba(255,255,255,.18);
  --accent:#f0c800;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0;background:#111;display:flex;align-items:center;justify-content:center}
#photo{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .18s ease,transform .25s ease}
#photo.fit{object-fit:contain;background:#0b0d10}
.scrim{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.38) 0%,rgba(0,0,0,.05) 28%,rgba(0,0,0,.05) 65%,rgba(0,0,0,.58) 100%);pointer-events:none}
.topbar{position:fixed;z-index:20;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:9px 12px;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.22)}
.title{font-weight:800;font-size:14px;line-height:1.35}
.sub{font-size:11px;color:#ddd;margin-top:2px}
.status{font-size:11px;text-align:right;line-height:1.45}
.controls{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:7px;max-width:96vw;overflow-x:auto;padding:3px 4px}
button{white-space:nowrap;border:1px solid rgba(255,255,255,.22);background:rgba(10,12,15,.82);color:#fff;border-radius:14px;min-height:44px;padding:9px 13px;font-weight:750;font-size:12px;backdrop-filter:blur(8px)}
button.active{background:var(--accent);color:#111;border-color:#ffe36a}
button.secondary{background:rgba(30,34,38,.78)}
.caption{position:fixed;z-index:19;left:max(14px,env(safe-area-inset-left));bottom:76px;max-width:min(62vw,520px);background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;backdrop-filter:blur(7px)}
.caption b{font-size:15px}
.caption div{font-size:11px;color:#ddd;margin-top:4px;line-height:1.45}
#rotate{display:none}
@media(orientation:portrait) and (max-width:900px){
  #rotate{display:flex;position:fixed;inset:0;z-index:999;background:#07090af5;align-items:center;justify-content:center;text-align:center}
  .rot{padding:25px 30px;background:#171a1e;border:1px solid rgba(255,255,255,.16);border-radius:20px}
}
</style>
</head>
<body>
<div id="stage"><img id="photo" src="assets/front.png" alt=""></div>
<div class="scrim"></div>

<div class="topbar">
  <div class="card">
    <div class="title">MB 1843AE / O500</div>
    <div class="sub">第 1 階段｜AI 高擬真展示版</div>
  </div>
  <div class="card status">
    目前只驗收畫面<br>
    下一階段再接互動功能
  </div>
</div>

<div class="caption">
  <b id="capTitle">前方三分之二</b>
  <div id="capText">先確認車頭、前擋、車身比例、輪胎位置與整體氣勢。</div>
</div>

<div class="controls">
  <button data-view="front" class="active">前方</button>
  <button data-view="side">側面</button>
  <button data-view="rear">車尾</button>
  <button data-view="interior">車內</button>
  <button data-view="cockpit">駕駛室</button>
  <button id="fit" class="secondary">完整顯示</button>
</div>

<div id="rotate"><div class="rot"><div style="font-size:50px">↻</div><b style="font-size:22px">請將手機橫向</b></div></div>

<script>
const data={
 front:{src:"assets/front.png",title:"前方三分之二",text:"先確認車頭、前擋、車身比例、輪胎位置與整體氣勢。"},
 side:{src:"assets/side.png",title:"側面",text:"確認 12.2 公尺長車身比例、側窗、行李艙門與前後輪位置。"},
 rear:{src:"assets/rear.png",title:"後方三分之二",text:"確認車尾、引擎散熱區、尾燈與後保桿造型。"},
 interior:{src:"assets/interior.png",title:"乘客座艙",text:"確認 2+2 座椅、中央走道、頭枕、行李架、窗簾與天花照明。"},
 cockpit:{src:"assets/cockpit.png",title:"左駕駕駛室",text:"確認台灣左駕、方向盤、儀表、中控、GO240-8 排檔與駕駛座配置。"}
};
const img=document.getElementById("photo");
const title=document.getElementById("capTitle");
const text=document.getElementById("capText");

function show(key){
  const v=data[key];
  img.style.opacity=".18";
  setTimeout(()=>{
    img.src=v.src;
    title.textContent=v.title;
    text.textContent=v.text;
    img.onload=()=>img.style.opacity="1";
  },90);
  document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===key));
}
document.querySelectorAll("[data-view]").forEach(b=>{
  b.addEventListener("click",()=>show(b.dataset.view));
  b.addEventListener("touchstart",e=>{e.preventDefault();show(b.dataset.view)},{passive:false});
});
document.getElementById("fit").onclick=()=>{
  img.classList.toggle("fit");
  document.getElementById("fit").textContent=img.classList.contains("fit")?"填滿畫面":"完整顯示";
};
</script>
</body>
</html>
