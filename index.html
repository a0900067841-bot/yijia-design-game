<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MB 1843AE / O500 手機互動版</title>
<style>
:root{--accent:#f2c900;--bg:#070a0d;--panel:rgba(8,12,16,.83);--line:rgba(255,255,255,.17)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
#app{position:fixed;inset:0;background:#05070a}
#scene{position:absolute;inset:0;overflow:hidden;background:#000}
#photo{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .15s ease,filter .25s ease,transform .25s ease}
#photo.lights{filter:brightness(1.13) contrast(1.04)}
.scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.02) 34%,rgba(0,0,0,.12) 64%,rgba(0,0,0,.58))}

#brand{position:absolute;z-index:20;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:8px 11px;backdrop-filter:blur(8px)}
#brand b{font-size:13px}#brand small{display:block;font-size:9px;color:#bbb;margin-top:2px}

#topStats{position:absolute;z-index:20;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:6px}
.stat{min-width:68px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:7px 9px;text-align:center;backdrop-filter:blur(8px)}
.stat small{display:block;color:#aaa;font-size:8px}.stat b{font-size:18px}.gear{color:#ffd900}

#leftMenu{position:absolute;z-index:22;left:max(8px,env(safe-area-inset-left));top:78px;display:flex;flex-direction:column;gap:6px}
.viewBtn{width:72px;min-height:42px;border:1px solid var(--line);background:#111820dc;color:#fff;border-radius:12px;font-size:10px;font-weight:800}
.viewBtn.active{background:var(--accent);color:#111}

#rightControls{position:absolute;z-index:22;right:max(8px,env(safe-area-inset-right));top:78px;display:grid;grid-template-columns:repeat(2,76px);gap:6px}
.ctrl{min-height:42px;border-radius:12px;border:1px solid var(--line);background:#111820e6;color:#fff;font-size:10px;font-weight:800}
.ctrl.on{background:var(--accent);color:#111}
.ctrl.red{background:#6d2626}

#bottomBar{position:absolute;z-index:23;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:6px;max-width:74vw;overflow-x:auto;padding:3px}
.bottomBtn{min-width:72px;min-height:44px;border:1px solid var(--line);background:#10161ce8;color:#fff;border-radius:12px;font-size:10px;font-weight:800}
.bottomBtn.on{background:var(--accent);color:#111}

#steer{position:absolute;z-index:24;left:max(12px,env(safe-area-inset-left));bottom:62px;width:112px;height:112px;border-radius:50%;background:#0007;border:1px solid #ffffff36;touch-action:none}
#knob{position:absolute;left:36px;top:36px;width:40px;height:40px;border-radius:50%;background:var(--accent);box-shadow:0 4px 14px #0007}
#pedals{position:absolute;z-index:24;right:max(12px,env(safe-area-inset-right));bottom:62px;display:flex;gap:8px}
.pedal{width:68px;height:64px;border-radius:14px;border:1px solid #ffffff35;color:#fff;font-weight:900}
.brake{background:#7b2828dd}.gas{background:#245c2ddd}

#gearPanel{position:absolute;z-index:24;right:max(12px,env(safe-area-inset-right));bottom:134px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:6px;display:flex;gap:5px;backdrop-filter:blur(8px)}
.gbtn{min-width:38px;height:36px;border-radius:9px;border:1px solid #ffffff25;background:#12181f;color:#fff;font-weight:900}
.gbtn.on{background:var(--accent);color:#111}

#msg{position:absolute;z-index:30;left:50%;top:18%;transform:translateX(-50%);background:#000d;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:11px;opacity:0;transition:.18s}
#msg.show{opacity:1}

#wiperOverlay{position:absolute;z-index:18;left:35%;top:39%;width:31%;height:3px;transform-origin:5% 50%;background:rgba(20,20,20,.88);border-radius:4px;display:none}
#wiperOverlay.run{display:block;animation:wipe 1.05s ease-in-out infinite}
@keyframes wipe{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(28deg)}}

#rotate{display:none}
@media(orientation:portrait) and (max-width:1000px){
 #rotate{display:flex;position:fixed;inset:0;z-index:999;background:#06080bf4;align-items:center;justify-content:center;text-align:center}
}
@media(max-width:760px){
 #brand{padding:6px 8px}#brand b{font-size:11px}
 .stat{min-width:56px;padding:5px 6px}.stat b{font-size:15px}
 .viewBtn{width:62px;min-height:38px;font-size:9px}
 #rightControls{grid-template-columns:repeat(2,66px)}.ctrl{min-height:38px;font-size:9px}
 #steer{width:100px;height:100px}#knob{left:32px;top:32px;width:36px;height:36px}
 .pedal{width:60px;height:58px}
 #bottomBar{max-width:68vw}
 .bottomBtn{min-width:64px;min-height:40px}
}
</style>
</head>
<body>
<div id="app">
  <div id="scene">
    <img id="photo" alt="">
    <div class="scrim"></div>
    <div id="wiperOverlay"></div>
  </div>

  <div id="brand"><b>MB 1843AE / O500</b><small>iPhone 橫向互動版｜固定使用你認可的寫實畫面</small></div>

  <div id="topStats">
    <div class="stat"><small>速度 km/h</small><b id="speed">0</b></div>
    <div class="stat"><small>rpm</small><b id="rpm">0</b></div>
    <div class="stat"><small>檔位</small><b id="gear" class="gear">N</b></div>
  </div>

  <div id="leftMenu">
    <button class="viewBtn active" data-view="front">前方</button>
    <button class="viewBtn" data-view="side">側面</button>
    <button class="viewBtn" data-view="rear">車尾</button>
    <button class="viewBtn" data-view="interior">車內</button>
    <button class="viewBtn" data-view="cockpit">駕駛室</button>
  </div>

  <div id="rightControls">
    <button id="engineBtn" class="ctrl">發動</button>
    <button id="parkBtn" class="ctrl on">手煞車</button>
    <button id="doorBtn" class="ctrl">前門</button>
    <button id="lightBtn" class="ctrl">頭燈</button>
    <button id="wiperBtn" class="ctrl">雨刷</button>
    <button id="hornBtn" class="ctrl">喇叭</button>
  </div>

  <div id="gearPanel">
    <button class="gbtn" data-gear="R">R</button>
    <button class="gbtn on" data-gear="N">N</button>
    <button class="gbtn" data-gear="A">A</button>
    <button id="minusBtn" class="gbtn">−</button>
    <button id="plusBtn" class="gbtn">＋</button>
  </div>

  <div id="steer"><div id="knob"></div></div>
  <div id="pedals">
    <button id="brakeBtn" class="pedal brake">煞車</button>
    <button id="gasBtn" class="pedal gas">油門</button>
  </div>

  <div id="bottomBar">
    <button id="boardBtn" class="bottomBtn" disabled>上車</button>
    <button id="outsideBtn" class="bottomBtn">回車外</button>
    <button id="doorBottom" class="bottomBtn">前門</button>
    <button id="wiperBottom" class="bottomBtn">雨刷</button>
    <button id="lightBottom" class="bottomBtn">燈光</button>
  </div>

  <div id="msg"></div>
</div>

<div id="rotate"><div><div style="font-size:50px">↻</div><b style="font-size:22px">請將手機橫向</b><div style="font-size:13px;color:#bbb;margin-top:6px">這版是 iPhone 橫向專用介面</div></div></div>

const $=id=>document.getElementById(id);
const photo=$("photo");
const state={
  view:"front",location:"outside",door:false,engine:false,park:true,lights:false,wiper:false,
  gear:"N",manual:1,speed:0,rpm:0,throttle:false,braking:false,steer:0
};

function toast(t){$("msg").textContent=t;$("msg").classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>$("msg").classList.remove("show"),1100)}
function ensureAudio(){if(!window.ac)window.ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}
function tone(f,d,type="sine",g=.04){ensureAudio();const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f;v.gain.value=g;o.connect(v).connect(ac.destination);o.start();v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}
function air(){tone(150,.16,"triangle",.025);setTimeout(()=>tone(86,.28,"sawtooth",.018),70)}
function horn(){tone(310,.34,"square",.055);tone(390,.34,"square",.035)}
function starter(){tone(82,.18,"sawtooth",.035);setTimeout(()=>tone(118,.30,"sawtooth",.045),120)}

function viewSrc(){
  if(state.view==="front") return state.door?IMG.front_open:IMG.front_closed;
  return IMG[state.view];
}

function setPhoto(){
  photo.style.opacity=.15;
  setTimeout(()=>{photo.src=viewSrc();photo.onload=()=>photo.style.opacity=1},60);
}

function setView(v){
  if(v==="interior" && state.location==="outside" && !state.door){toast("請先開前門上車");return}
  state.view=v;
  if(v==="cockpit")state.location="driver";
  else if(v==="interior")state.location="saloon";
  else state.location="outside";
  document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
  setPhoto();render();
}

function render(){
  $("speed").textContent=Math.round(state.speed);
  $("rpm").textContent=Math.round(state.rpm);
  $("gear").textContent=state.gear==="A"?"A"+state.manual:state.gear;
  $("engineBtn").textContent=state.engine?"熄火":"發動";
  [["engineBtn",state.engine],["parkBtn",state.park],["doorBtn",state.door],["lightBtn",state.lights],["wiperBtn",state.wiper],["doorBottom",state.door],["lightBottom",state.lights],["wiperBottom",state.wiper]].forEach(([id,on])=>$(id).classList.toggle("on",!!on));
  document.querySelectorAll("[data-gear]").forEach(b=>b.classList.toggle("on",b.dataset.gear===state.gear));
  $("boardBtn").disabled=!state.door||state.location!=="outside";
  photo.classList.toggle("lights",state.lights);
  $("wiperOverlay").classList.toggle("run",state.wiper && state.view==="cockpit");
}

document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));

$("engineBtn").onclick=()=>{ensureAudio();if(!state.engine){if(state.gear!=="N"){toast("請先切到 N 檔");return}starter();state.engine=true;state.rpm=620;toast("引擎已發動")}else{state.engine=false;state.speed=0;state.rpm=0;toast("引擎已熄火")}render()};
$("parkBtn").onclick=()=>{state.park=!state.park;air();render()};
function toggleDoor(){if(state.speed>1){toast("車輛移動中不能開門");return}state.door=!state.door;air();setPhoto();render();toast(state.door?"前門已打開":"前門已關閉")}
$("doorBtn").onclick=toggleDoor;$("doorBottom").onclick=toggleDoor;
function toggleLight(){state.lights=!state.lights;render();toast(state.lights?"頭燈 ON":"頭燈 OFF")}
$("lightBtn").onclick=toggleLight;$("lightBottom").onclick=toggleLight;
function toggleWiper(){state.wiper=!state.wiper;render();}
$("wiperBtn").onclick=toggleWiper;$("wiperBottom").onclick=toggleWiper;
$("hornBtn").onclick=()=>{horn();toast("叭——")};
$("boardBtn").onclick=()=>{if(!state.door)return;setView("interior");toast("已上車")};
$("outsideBtn").onclick=()=>{state.location="outside";setView("front");toast("已回到車外")};

document.querySelectorAll("[data-gear]").forEach(b=>b.onclick=()=>{const g=b.dataset.gear;if(g!=="N"&&!state.engine){toast("請先發動引擎");return}if(state.speed>1&&g!==state.gear){toast("移動中不能切換");return}state.gear=g;render()});
$("plusBtn").onclick=()=>{if(state.gear==="A"){state.manual=Math.min(8,state.manual+1);render()}};
$("minusBtn").onclick=()=>{if(state.gear==="A"){state.manual=Math.max(1,state.manual-1);render()}};

function hold(el,key){const on=e=>{e.preventDefault();state[key]=true;ensureAudio()};const off=e=>{e.preventDefault();state[key]=false};el.addEventListener("pointerdown",on);["pointerup","pointerleave","pointercancel"].forEach(n=>el.addEventListener(n,off))}
hold($("gasBtn"),"throttle");hold($("brakeBtn"),"braking");

const pad=$("steer"),knob=$("knob");let pid=null;
function moveSteer(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.30,d=Math.hypot(dx,dy)||1;if(d>max){dx*=max/d;dy*=max/d}knob.style.transform=`translate(${dx}px,${dy}px)`;state.steer=Math.max(-1,Math.min(1,dx/max))}
pad.addEventListener("pointerdown",e=>{pid=e.pointerId;pad.setPointerCapture(pid);moveSteer(e)});pad.addEventListener("pointermove",e=>{if(e.pointerId===pid)moveSteer(e)});
function release(e){if(e.pointerId!==pid)return;pid=null;knob.style.transform="translate(0,0)";state.steer=0}pad.addEventListener("pointerup",release);pad.addEventListener("pointercancel",release);

setInterval(()=>{
  if(state.engine){
    let target=620;
    if(state.throttle&&!state.park&&state.gear!=="N"){target=1700;state.speed=Math.min(state.gear==="R"?18:100,state.speed+(state.gear==="R"?.28:.38))}
    else state.speed=Math.max(0,state.speed-.10);
    if(state.braking)state.speed=Math.max(0,state.speed-1.15);
    if(state.park)state.speed=Math.max(0,state.speed-.75);
    state.rpm+=(target-state.rpm)*.18;
  }else{state.rpm=0;state.speed=Math.max(0,state.speed-.45)}
  render();
},100);

setView("front");render();
</script>
</body>
