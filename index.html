<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>MB1843 v2</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;top:8px;z-index:10;background:#0009;border-radius:12px;padding:7px 10px;font-size:12px}.l{left:8px}.r{right:8px;text-align:right}#joy{position:fixed;left:18px;bottom:18px;width:124px;height:124px;border:2px solid #ffffff55;border-radius:50%;background:#0005;z-index:20}#knob{position:absolute;left:34px;top:34px;width:52px;height:52px;border-radius:50%;background:#fffddd;border:2px solid #fff}#actions{position:fixed;right:14px;top:38%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px;z-index:20}button{min-height:40px;border-radius:12px;border:1px solid #ffffff44;background:#000a;color:#fff;padding:7px 10px}.primary{background:#e0bd00e8;color:#111;font-weight:800}#drive{position:fixed;right:12px;bottom:12px;display:flex;gap:8px;align-items:flex-end;z-index:20}.pedal{width:66px;height:96px}.gas{background:#d9bb00e8;color:#111}.brake{background:#8d2727e8}.steer{width:54px;height:54px;border-radius:50%}#gears{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;z-index:20}#load{position:fixed;inset:0;background:#111;z-index:100;display:flex;align-items:center;justify-content:center;text-align:center}.muted{font-size:13px;color:#aaa;margin-top:8px}@media(orientation:portrait) and (max-width:900px){#rot{display:flex!important}}#rot{display:none;position:fixed;inset:0;z-index:999;background:#080808f2;align-items:center;justify-content:center;text-align:center}</style></head><body>
<canvas id="game"></canvas><div class="hud l"><b id="mode">步行模式</b><br><span id="status">左下搖桿移動</span></div><div class="hud r"><b id="speed">0 km/h</b><br><span id="gear">N・手煞車 ON</span><br><span id="engine">引擎 OFF</span></div>
<div id="joy"><div id="knob"></div></div><div id="actions"><button id="door" class="primary">開／關前門</button><button id="seat">坐駕駛座</button><button id="start">啟動引擎</button><button id="park">氣壓手煞車</button><button id="exit">離開駕駛座</button><button id="reset">重置</button></div>
<div id="gears"><button id="down">檔位 −</button><button id="up">檔位 ＋</button></div><div id="drive"><button id="sl" class="steer">◀</button><button id="sr" class="steer">▶</button><button id="brake" class="pedal brake">煞車</button><button id="gas" class="pedal gas">油門</button></div>
<div id="load"><div><b>MB 1843AE v2.0</b><div class="muted">載入獨立車模 bus.glb…</div></div></div><div id="rot"><div><div style="font-size:50px">↻</div><b>請把手機橫向</b></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/+esm"}}</script><script type="module">
import * as THREE from "three";import{GLTFLoader}from"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";const $=x=>document.getElementById(x);
const renderer=new THREE.WebGLRenderer({canvas:$("game"),antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ac9e8);scene.fog=new THREE.Fog(0x9ac9e8,55,150);const camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.05,300);
scene.add(new THREE.HemisphereLight(0xffffff,0x637357,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(16,24,12);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshStandardMaterial({color:0x728b5d}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(120,22),new THREE.MeshStandardMaterial({color:0x414448}));road.rotation.x=-Math.PI/2;road.position.y=.01;scene.add(road);
let bus=(await new GLTFLoader().loadAsync("./bus.glb")).scene;scene.add(bus);$("load").style.display="none";
const s={seated:false,door:false,engine:false,park:true,gear:0,speed:0,steer:0,player:new THREE.Vector3(8,1.7,4.5),yaw:-2.6,pitch:-.03,jx:0,jy:0,gas:false,brake:false,sl:false,sr:false,last:performance.now()};const GN=["N","1","2","3","4","5","6","7","8"];
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}resize();addEventListener("resize",resize);
const joy=$("joy"),knob=$("knob");let jp=null;function jm(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.31,L=Math.hypot(dx,dy)||1;if(L>max){dx*=max/L;dy*=max/L}s.jx=dx/max;s.jy=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}joy.onpointerdown=e=>{jp=e.pointerId;joy.setPointerCapture(jp);jm(e)};joy.onpointermove=e=>{if(e.pointerId===jp)jm(e)};joy.onpointerup=joy.onpointercancel=e=>{if(e.pointerId===jp){jp=null;s.jx=s.jy=0;knob.style.transform="translate(0,0)"}};
let drag=null,lx=0,ly=0;$("game").onpointerdown=e=>{drag=e.pointerId;lx=e.clientX;ly=e.clientY;$("game").setPointerCapture(drag)};$("game").onpointermove=e=>{if(e.pointerId!==drag)return;let dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;s.yaw-=dx*.006;s.pitch=Math.max(-1,Math.min(.85,s.pitch-dy*.0045))};
function hold(id,key){const el=$(id);el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);s[key]=true};el.onpointerup=el.onpointercancel=e=>s[key]=false}hold("gas","gas");hold("brake","brake");hold("sl","sl");hold("sr","sr");
$("door").onclick=()=>s.door=!s.door;$("seat").onclick=()=>{if(s.door)s.seated=true};$("exit").onclick=()=>{s.seated=false;s.speed=0};$("start").onclick=()=>s.engine=!s.engine;$("park").onclick=()=>s.park=!s.park;$("up").onclick=()=>s.gear=Math.min(8,s.gear+1);$("down").onclick=()=>s.gear=Math.max(0,s.gear-1);$("reset").onclick=()=>{s.seated=false;s.player.set(8,1.7,4.5);s.speed=0;s.gear=0;s.engine=false;s.park=true;bus.position.set(0,0,0);bus.rotation.y=0};
function ui(){$("mode").textContent=s.seated?"駕駛模式":"步行模式";$("status").textContent=s.seated?(s.engine?"可以駕駛":"請啟動引擎"):(s.door?"前門已開，可走上車":"左下搖桿移動");$("speed").textContent=Math.round(s.speed)+" km/h";$("gear").textContent=GN[s.gear]+"・手煞車 "+(s.park?"ON":"OFF");$("engine").textContent="引擎 "+(s.engine?"ON":"OFF");$("seat").style.display=s.seated?"none":"block";$("start").style.display=s.seated?"block":"none";$("park").style.display=s.seated?"block":"none";$("exit").style.display=s.seated?"block":"none";$("gears").style.display=s.seated?"flex":"none";$("drive").style.opacity=s.seated?"1":".25";$("drive").style.pointerEvents=s.seated?"auto":"none";$("joy").style.opacity=s.seated?".25":"1";$("joy").style.pointerEvents=s.seated?"none":"auto"}
function walk(dt){const f=new THREE.Vector3(Math.sin(s.yaw),0,-Math.cos(s.yaw)),r=new THREE.Vector3(f.z,0,-f.x),m=new THREE.Vector3();m.addScaledVector(r,s.jx).addScaledVector(f,-s.jy);if(m.lengthSq()>1)m.normalize();s.player.addScaledVector(m,2.8*dt);camera.position.lerp(s.player,.45);const d=new THREE.Vector3(Math.sin(s.yaw)*Math.cos(s.pitch),Math.sin(s.pitch),-Math.cos(s.yaw)*Math.cos(s.pitch));camera.lookAt(camera.position.clone().add(d))}
function drive(dt){const tar=s.sl?.55:s.sr?-.55:0;s.steer+=(tar-s.steer)*Math.min(1,dt*5.5);if(s.engine&&!s.park&&s.gear>0&&s.gas)s.speed+=12.5*(1-(s.gear-1)*.055)*dt;if(s.brake)s.speed-=35*dt;if(s.park)s.speed-=48*dt;if(!s.gas)s.speed-=2.2*dt;s.speed=Math.max(0,Math.min(120,s.speed));if(s.speed>.01){const v=s.speed/3.6;bus.rotation.y+=s.steer*v*dt*.038;bus.position.x+=Math.cos(bus.rotation.y)*v*dt;bus.position.z+=Math.sin(bus.rotation.y)*v*dt}bus.updateMatrixWorld(true);const p=new THREE.Vector3(4.45,2.1,-.58).applyMatrix4(bus.matrixWorld),f=new THREE.Vector3(1,0,0).applyQuaternion(bus.quaternion);camera.position.lerp(p,.5);camera.lookAt(p.clone().add(f.multiplyScalar(16)))}
function loop(t){const dt=Math.min(.033,(t-s.last)/1000);s.last=t;s.seated?drive(dt):walk(dt);ui();renderer.render(scene,camera);requestAnimationFrame(loop)}ui();requestAnimationFrame(t=>{s.last=t;requestAnimationFrame(loop)});
</script></body></html>
