<title>MB 1843AE / O500 AI 高擬真展示版</title>
<style>
:root{--panel:rgba(10,13,16,.72);--line:rgba(255,255,255,.18);--accent:#f0c800}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0;background:#111;display:flex;align-items:center;justify-content:center}
#photo{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .18s ease}
#photo.fit{object-fit:contain;background:#0b0d10}
.scrim{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.38),rgba(0,0,0,.04) 30%,rgba(0,0,0,.05) 65%,rgba(0,0,0,.6));pointer-events:none}
.topbar{position:fixed;z-index:20;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:9px 12px;backdrop-filter:blur(8px)}
.title{font-weight:800;font-size:14px}.sub,.status{font-size:11px;color:#ddd;line-height:1.4}.status{text-align:right}
.controls{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:7px;max-width:96vw;overflow-x:auto;padding:3px}
button{white-space:nowrap;border:1px solid #ffffff38;background:#0b0d10dd;color:#fff;border-radius:14px;min-height:44px;padding:9px 13px;font-weight:750;font-size:12px}
button.active{background:var(--accent);color:#111}
.caption{position:fixed;z-index:19;left:max(14px,env(safe-area-inset-left));bottom:76px;max-width:min(62vw,520px);background:#0009;border:1px solid #ffffff28;border-radius:14px;padding:10px 12px;backdrop-filter:blur(7px)}
.caption b{font-size:15px}.caption div{font-size:11px;color:#ddd;margin-top:4px;line-height:1.45}
#rotate{display:none}
@media(orientation:portrait) and (max-width:900px){#rotate{display:flex;position:fixed;inset:0;z-index:999;background:#07090af5;align-items:center;justify-content:center;text-align:center}}
</style>
</head>
