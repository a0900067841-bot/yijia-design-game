<title>MB 1843AE / O500 第3.1階段 3D駕駛強化版</title>
<style>
:root{--panel:rgba(9,12,16,.86);--line:rgba(255,255,255,.16);--accent:#f1c800;--bg:#070a0d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
#app{position:fixed;inset:0;display:grid;grid-template-columns:90px 1fr 212px;grid-template-rows:1fr 56px}
#left{grid-row:1/3;background:#0b1016;border-right:1px solid var(--line);padding:10px 7px 7px max(7px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:7px;z-index:20}
#right{grid-row:1/3;background:#0b1016;border-left:1px solid var(--line);padding:10px max(10px,env(safe-area-inset-right)) 10px 10px;overflow:auto;z-index:20}
#main{position:relative;overflow:hidden}#bottom{display:flex;align-items:center;gap:7px;padding:6px;background:#0a0e12;border-top:1px solid var(--line);overflow:auto}
#c{width:100%;height:100%;display:block;touch-action:none}
.brand{font-weight:900;font-size:12px;padding:4px 3px 9px;border-bottom:1px solid var(--line);margin-bottom:3px}.brand small{display:block;font-weight:400;font-size:9px;color:#aaa;line-height:1.25;margin-top:2px}
.viewBtn{width:100%;min-height:48px;border:1px solid var(--line);background:#161d25;color:#fff;border-radius:12px;font-size:10px;font-weight:800;padding:5px}.viewBtn.active{background:var(--accent);color:#111}
.panel{background:#121922;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px;margin-bottom:8px}.panel h3{font-size:10px;color:#d2d2d2;margin:0 0 7px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.stat{background:#090d11;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:7px;text-align:center}.stat small{display:block;font-size:8px;color:#aaa}.stat b{font-size:18px}.gear{color:#ffd800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}.geargrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.ctrl,.gearBtn,.bottomBtn{border:1px solid rgba(255,255,255,.18);background:#151c23;color:#fff;border-radius:11px;min-height:40px;padding:7px 9px;font-weight:800;font-size:11px}.ctrl.on,.gearBtn.on,.bottomBtn.on{background:var(--accent);color:#111}
.help{font-size:9px;color:#a9a9a9;line-height:1.45}

#status{min-width:120px;text-align:right}

@media(max-width:920px){#app{grid-template-columns:74px 1fr 176px;grid-template-rows:1fr 52px}.viewBtn{min-height:44px;font-size:9px}.panel{padding:6px}.stat b{font-size:15px}#pad,#pedals{display:flex}.bottomBtn{min-width:78px}}
@media(orientation:portrait) and (max-width:1000px){#rotate{display:flex;position:fixed;inset:0;z-index:999;background:#06080bf5;align-items:center;justify-content:center;text-align:center}}
</style>
</head>
<body>
<div id="app">
  <aside id="left">
    <div class="brand">MB 1843AE<small>O500｜第 3.1 階段<br>3D 駕駛強化版</small></div>
    <button class="viewBtn active" data-view="orbit">車外</button>
    <button class="viewBtn" data-view="front">車頭</button>
    <button class="viewBtn" data-view="rear">車尾</button>
    <button class="viewBtn" data-view="interior">車內</button>
    <button class="viewBtn" data-view="cockpit">駕駛室</button>
  </aside>

  <main id="main">
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="card"><b>3D 可駕駛強化版</b><br>這版繼續補：可駕駛核心、視角、UI、車門、雨刷</div>
      <div class="card" id="status">引擎 OFF｜手煞車 ON<br>檔位 N</div>
    </div>
    <div id="msg"></div>
    <div id="pad"><div id="knob"></div></div>
    <div id="pedals">
      <button id="mBrake" class="pedal brake">煞車</button>
      <button id="mGas" class="pedal gas">油門</button>
    </div>
  </main>

  <aside id="right">
    <section class="panel">
      <h3>儀表</h3>
      <div class="stats">
        <div class="stat"><small>km/h</small><b id="speed">0</b></div>
        <div class="stat"><small>rpm</small><b id="rpm">0</b></div>
        <div class="stat"><small>GEAR</small><b id="gear" class="gear">N</b></div>
      </div>
      <div class="help" style="margin-top:6px">氣壓 8.4 bar</div>
    </section>
    <section class="panel">
      <h3>車輛控制</h3>
      <div class="grid2">
        <button id="engineBtn" class="ctrl">發動</button>
        <button id="parkBtn" class="ctrl on">手煞車</button>
        <button id="doorBtn" class="ctrl">前門</button>
        <button id="lightBtn" class="ctrl">頭燈</button>
        <button id="wiperBtn" class="ctrl">雨刷</button>
        <button id="hornBtn" class="ctrl">喇叭</button>
      </div>
    </section>
    <section class="panel">
      <h3>GO240-8</h3>
      <div class="geargrid">
        <button class="gearBtn" data-gear="R">R</button>
        <button class="gearBtn on" data-gear="N">N</button>
        <button class="gearBtn" data-gear="A">A</button>
      </div>
      <div class="grid2" style="margin-top:5px">
        <button id="minusBtn" class="gearBtn">－</button>
        <button id="plusBtn" class="gearBtn">＋</button>
      </div>
      <div class="help" style="margin-top:6px">A 檔可切 A1～A8；移動中不可直接切換 R / A。</div>
    </section>
    <section class="panel">
      <h3>操作說明</h3>
      <div class="help">iPhone：左下圓盤轉向，右下油門／煞車。<br>電腦：WASD 或方向鍵。<br>在駕駛室／車內視角，可拖動畫面看左右。</div>
    </section>
  </aside>

  <footer id="bottom">
    <button id="resetBtn" class="bottomBtn">回道路</button>
    <button id="camBtn" class="bottomBtn">切視角</button>
    <button id="doorBottom" class="bottomBtn">前門</button>
    <button id="wiperBottom" class="bottomBtn">雨刷</button>
    <button id="lightBottom" class="bottomBtn">燈光</button>
  </footer>
</div>
<div id="rotate"><div><div style="font-size:50px">↻</div><b style="font-size:22px">請將手機橫向</b><div style="font-size:13px;color:#bdbdbd;margin-top:6px">3D 駕駛版橫向比較好操作</div></div></div>

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1; if(e.key===' ') e.preventDefault();}); addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;});

let lookYaw=0, lookPitch=0, lookId=null, lx=0, ly=0; $('c').addEventListener('pointerdown',e=>{lookId=e.pointerId; lx=e.clientX; ly=e.clientY; $('c').setPointerCapture(lookId)}); $('c').addEventListener('pointermove',e=>{if(e.pointerId!==lookId) return; if(state.view==='cockpit'||state.view==='interior'){lookYaw-=(e.clientX-lx)*.004; lookPitch=THREE.MathUtils.clamp(lookPitch-(e.clientY-ly)*.003,-.35,.35);} lx=e.clientX; ly=e.clientY;}); $('c').addEventListener('pointerup',e=>{if(e.pointerId===lookId) lookId=null}); $('c').addEventListener('pointercancel',e=>{if(e.pointerId===lookId) lookId=null});

const v1=new THREE.Vector3(), v2=new THREE.Vector3(), UP=new THREE.Vector3(0,1,0); let last=performance.now();

  updateUI(); renderer.render(scene,camera); requestAnimationFrame(loop);
