<div id="app">
<aside id="left"><div class="brand">MB 1843AE<small>O500｜3D 駕駛核心</small></div>
<button class="view active" data-view="orbit">車外</button><button class="view" data-view="front">車頭</button><button class="view" data-view="rear">車尾</button><button class="view" data-view="interior">車內</button><button class="view" data-view="cockpit">駕駛室</button></aside>
<div id="main"><canvas id="c"></canvas><div id="hud"><div><b>第3階段｜真正3D可駕駛核心版</b><br>先驗收：前進／倒車／轉向／煞車</div><div id="status">引擎 OFF｜手煞車 ON｜N</div></div><div id="msg"></div>

<div class="panel"><h3>操作</h3><div class="help">iPhone：左下圓盤轉向，右下油門／煞車。<br>電腦：WASD 或方向鍵。<br>駕駛／車內視角可拖動畫面看左右。</div></div>
</aside>
<div id="bottom"><button id="reset">回道路</button><button id="cam">切視角</button><button id="door2">前門</button><button id="wiper2">雨刷</button><button id="light2">燈光</button></div>
</div>
<div id="rotate"><div><div style="font-size:50px">↻</div><b>請將手機橫向</b></div></div>
